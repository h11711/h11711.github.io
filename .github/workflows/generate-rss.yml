name: Generate RSS

on:
  push:
    branches: [main]
    paths:
      - 'articles.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate rss.xml
        run: node .github/scripts/generate-rss.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss/rss.xml
          git diff --staged --quiet || git commit -m "chore: auto-generate rss.xml"
          git push
