<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节日 - Steve Huang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        body { 
            font-family: 'Inter', 'Noto Sans SC', sans-serif; 
            color: #fff;
            overflow-x: hidden;
        }
        
        .bg-festival {
            background-image: var(--bg-image, url('img/festival-default.jpg'));
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .bg-overlay {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(3px);
        }
        
        .particle {
            position: fixed;
            pointer-events: none;
            animation: float 4s ease-out forwards;
            z-index: 10;
        }
        @keyframes float {
            0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-100vh) scale(0.3) rotate(360deg); }
        }
        
        .lantern { animation: swing 3s ease-in-out infinite; transform-origin: top center; }
        @keyframes swing {
            0%, 100% { transform: rotate(-6deg); }
            50% { transform: rotate(6deg); }
        }
        
        .glow { animation: glow 2s ease-in-out infinite; }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 30px rgba(234, 179, 8, 0.2); }
            50% { box-shadow: 0 0 60px rgba(234, 179, 8, 0.5); }
        }
        
        .countdown-num {
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .bg-btn {
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .bg-btn:hover, .bg-btn.active {
            border-color: #fff;
            transform: scale(1.1);
        }
        
        .holiday-card {
            transition: all 0.3s;
        }
        .holiday-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body class="bg-festival min-h-screen relative">

    <div class="bg-overlay fixed inset-0 z-0"></div>
    <div id="particles" class="fixed inset-0 pointer-events-none z-10"></div>

    <!-- 顶部导航 -->
    <nav class="relative z-20 flex items-center justify-between px-6 py-4">
        <a href="./index.html" class="text-white font-bold text-lg hover:opacity-70 transition-opacity flex items-center gap-2">
            <span>←</span>
            <span>Steve Huang</span>
        </a>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <button onclick="changeBg('national')" class="bg-btn w-8 h-8 rounded-full bg-red-600" title="国庆"></button>
                <button onclick="changeBg('midautumn')" class="bg-btn w-8 h-8 rounded-full bg-yellow-500" title="中秋"></button>
                <button onclick="changeBg('spring')" class="bg-btn w-8 h-8 rounded-full bg-red-800" title="春节"></button>
                <button onclick="changeBg('christmas')" class="bg-btn w-8 h-8 rounded-full bg-green-600" title="圣诞"></button>
                <button onclick="changeBg('night')" class="bg-btn w-8 h-8 rounded-full bg-slate-800" title="夜景"></button>
            </div>
            <div class="text-sm text-white/60" id="currentDate"></div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="relative z-20 max-w-3xl mx-auto px-6 py-8 text-center">

        <!-- 节日图标 -->
        <div class="text-7xl mb-6 lantern inline-block" id="festivalIcon">🎉</div>

        <!-- 节日标题 -->
        <h1 class="text-5xl lg:text-6xl font-bold mb-4 drop-shadow-lg" id="festivalTitle">节日快乐</h1>
        <p class="text-xl text-white/80 mb-12 drop-shadow" id="festivalSubtitle">愿你天天开心</p>

        <!-- 倒计时 -->
        <div class="bg-black/40 border border-white/10 rounded-2xl p-8 mb-8 glow backdrop-blur-sm">
            <p class="text-sm text-white/50 mb-4 uppercase tracking-widest" id="countdownLabel">距离假期结束</p>
            <div class="flex justify-center gap-3 lg:gap-6">
                <div class="text-center">
                    <div class="text-5xl lg:text-6xl font-bold countdown-num" id="days">0</div>
                    <div class="text-xs text-white/50 mt-1">天</div>
                </div>
                <div class="text-5xl lg:text-6xl font-bold text-white/30">:</div>
                <div class="text-center">
                    <div class="text-5xl lg:text-6xl font-bold countdown-num" id="hours">00</div>
                    <div class="text-xs text-white/50 mt-1">时</div>
                </div>
                <div class="text-5xl lg:text-6xl font-bold text-white/30">:</div>
                <div class="text-center">
                    <div class="text-5xl lg:text-6xl font-bold countdown-num" id="minutes">00</div>
                    <div class="text-xs text-white/50 mt-1">分</div>
                </div>
                <div class="text-5xl lg:text-6xl font-bold text-white/30">:</div>
                <div class="text-center">
                    <div class="text-5xl lg:text-6xl font-bold countdown-num" id="seconds">00</div>
                    <div class="text-xs text-white/50 mt-1">秒</div>
                </div>
            </div>
        </div>

        <!-- 节日寄语 -->
        <div class="bg-black/30 border border-white/10 rounded-xl p-6 mb-8 backdrop-blur-sm">
            <p class="text-lg text-white/90 italic leading-relaxed" id="festivalQuote">"节日快乐！"</p>
        </div>

        <!-- 全年节日一览 -->
        <div class="text-left mb-8">
            <h2 class="text-lg font-semibold text-white mb-4 text-center">📅 全年节日</h2>
            <div id="holidayList" class="grid grid-cols-2 md:grid-cols-3 gap-3 max-h-64 overflow-y-auto">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 返回 -->
        <a href="https://stevehuang.eu.org/index.html" class="inline-flex items-center gap-2 px-8 py-3 bg-white text-black font-semibold rounded-xl hover:bg-white/90 transition-colors">
            返回主页
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>

    </main>

    <footer class="relative z-20 text-center py-8 text-xs text-white/40">
        <p>Steve Huang · 节日</p>
    </footer>

<script>
// ========== 完整节日库 ==========
const HOLIDAYS = [
    { id: 'newyear', name: '元旦', icon: '🎆', month: 1, day: 1, duration: 1, bg: 'img/festival-newyear.jpg', particles: ['🎆', '✨', '⭐', '🎊'], quote: '新年新气象，万事开门红。' },
    { id: 'spring', name: '春节', icon: '🧧', month: 1, day: 29, duration: 7, bg: 'img/festival-spring.jpg', particles: ['🧧', '✨', '🎆', '🏮', '⭐'], quote: '爆竹声中一岁除，春风送暖入屠苏。' },
    { id: 'lantern', name: '元宵节', icon: '🏮', month: 2, day: 12, duration: 1, bg: 'img/festival-lantern.jpg', particles: ['🏮', '✨', '🌕', '⭐'], quote: '月上柳梢头，人约黄昏后。' },
    { id: 'valentine', name: '情人节', icon: '❤️', month: 2, day: 14, duration: 1, bg: 'img/festival-valentine.jpg', particles: ['❤️', '✨', '💕', '🌹'], quote: 'Love is composed of a single soul inhabiting two bodies.' },
    { id: 'womenday', name: '妇女节', icon: '👩', month: 3, day: 8, duration: 1, bg: 'img/festival-women.jpg', particles: ['👩', '✨', '💐', '🌸'], quote: '巾帼不让须眉，红颜更胜儿郎。' },
    { id: 'qingming', name: '清明节', icon: '🌿', month: 4, day: 4, duration: 3, bg: 'img/festival-qingming.jpg', particles: ['🌿', '✨', '🍃', '🌧️'], quote: '清明时节雨纷纷，路上行人欲断魂。' },
    { id: 'earth', name: '地球日', icon: '🌍', month: 4, day: 22, duration: 1, bg: 'img/festival-earth.jpg', particles: ['🌍', '🌱', '💚', '✨'], quote: '保护地球，人人有责。' },
    { id: 'labor', name: '劳动节', icon: '🛠️', month: 5, day: 1, duration: 5, bg: 'img/festival-labor.jpg', particles: ['🛠️', '✨', '⭐', '🔧'], quote: '劳动最光荣，奋斗最幸福。' },
    { id: 'mothers', name: '母亲节', icon: '💐', month: 5, day: 11, duration: 1, bg: 'img/festival-mothers.jpg', particles: ['💐', '✨', '🌸', '❤️'], quote: '谁言寸草心，报得三春晖。' },
    { id: 'dragonboat', name: '端午节', icon: '🐉', month: 5, day: 31, duration: 3, bg: 'img/festival-dragonboat.jpg', particles: ['🐉', '✨', '🛶', '🍃'], quote: '端午临中夏，时清日复长。' },
    { id: 'children', name: '儿童节', icon: '🎈', month: 6, day: 1, duration: 1, bg: 'img/festival-children.jpg', particles: ['🎈', '✨', '🎠', '🌈'], quote: '愿你出走半生，归来仍是少年。' },
    { id: 'fathers', name: '父亲节', icon: '👨', month: 6, day: 15, duration: 1, bg: 'img/festival-fathers.jpg', particles: ['👨', '✨', '💙', '⭐'], quote: '父爱如山，深沉而伟大。' },
    { id: 'qixi', name: '七夕节', icon: '💕', month: 8, day: 29, duration: 1, bg: 'img/festival-qixi.jpg', particles: ['💕', '✨', '🌟', '🌙'], quote: '两情若是久长时，又岂在朝朝暮暮。' },
    { id: 'midautumn', name: '中秋节', icon: '🌕', month: 10, day: 6, duration: 3, bg: 'img/festival-midautumn.jpg', particles: ['🌕', '✨', '🥮', '🐇', '🌙'], quote: '但愿人长久，千里共婵娟。' },
    { id: 'national', name: '国庆节', icon: '🇨🇳', month: 10, day: 1, duration: 7, bg: 'img/festival-national.jpg', particles: ['🇨🇳', '✨', '⭐', '🔴', '🎉'], quote: '愿以吾辈之青春，捍卫盛世之中华。' },
    { id: 'halloween', name: '万圣节', icon: '🎃', month: 10, day: 31, duration: 1, bg: 'img/festival-halloween.jpg', particles: ['🎃', '✨', '👻', '🦇'], quote: 'Trick or treat!' },
    { id: 'chongyang', name: '重阳节', icon: '🍂', month: 10, day: 29, duration: 1, bg: 'img/festival-chongyang.jpg', particles: ['🍂', '✨', '🏔️', '🌼'], quote: '遥知兄弟登高处，遍插茱萸少一人。' },
    { id: 'thanksgiving', name: '感恩节', icon: '🦃', month: 11, day: 27, duration: 1, bg: 'img/festival-thanksgiving.jpg', particles: ['🦃', '✨', '🍁', '💛'], quote: '感恩有你，一路同行。' },
    { id: 'christmas', name: '圣诞节', icon: '🎅', month: 12, day: 25, duration: 3, bg: 'img/festival-christmas.jpg', particles: ['🎅', '✨', '🎄', '❄️', '🎁'], quote: 'Merry Christmas! 愿平安喜乐常伴。' },
    { id: 'newyear-eve', name: '跨年夜', icon: '🎆', month: 12, day: 31, duration: 1, bg: 'img/festival-newyear.jpg', particles: ['🎆', '✨', '⭐', '🎊', '🥂'], quote: '再见旧岁，你好新年！' }
];

const BG_IMAGES = {
    'national': './img/festival-national.jpg',
    'midautumn': './img/festival-midautumn.jpg',
    'spring': './img/festival-spring.jpg',
    'christmas': './img/festival-christmas.jpg',
    'night': './img/festival-night.jpg'
};

// ========== 检测当前节日 ==========
function getCurrentHoliday() {
    const now = new Date();
    for (const h of HOLIDAYS) {
        const start = new Date(now.getFullYear(), h.month - 1, h.day);
        const end = new Date(start);
        end.setDate(end.getDate() + h.duration - 1);
        if (now >= start && now <= end) return h;
    }
    return HOLIDAYS[0]; // 默认元旦
}

// ========== 初始化 ==========
function init() {
    const holiday = getCurrentHoliday();
    const now = new Date();
    
    document.getElementById('festivalTitle').textContent = holiday.name + '快乐';
    document.getElementById('festivalSubtitle').textContent = holiday.quote;
    document.getElementById('festivalIcon').textContent = holiday.icon;
    document.getElementById('festivalQuote').textContent = '"' + holiday.quote + '"';
    document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN');
    
    document.body.style.setProperty('--bg-image', `url('${holiday.bg}')`);
    
    // 计算结束时间
    const endDate = new Date(now.getFullYear(), holiday.month - 1, holiday.day);
    endDate.setDate(endDate.getDate() + holiday.duration - 1);
    startCountdown(endDate);
    startParticles(holiday.particles);
    renderHolidayList();
}

// ========== 切换背景 ==========
function changeBg(type) {
    const bgUrl = BG_IMAGES[type];
    if (bgUrl) {
        document.body.style.setProperty('--bg-image', `url('${bgUrl}')`);
    }
    document.querySelectorAll('.bg-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
}

// ========== 倒计时 ==========
function startCountdown(endDate) {
    function update() {
        const now = Date.now();
        const diff = endDate - now;
        
        if (diff <= 0) {
            document.getElementById('days').textContent = '0';
            document.getElementById('hours').textContent = '00';
            document.getElementById('minutes').textContent = '00';
            document.getElementById('seconds').textContent = '00';
            document.getElementById('countdownLabel').textContent = '节日已结束，期待下一个';
            return;
        }
        
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        
        document.getElementById('days').textContent = days;
        document.getElementById('hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
        document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }
    
    update();
    setInterval(update, 1000);
}

// ========== 粒子 ==========
function startParticles(emojis) {
    const container = document.getElementById('particles');
    
    function create() {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = Math.random() * 100 + 'vw';
        p.style.bottom = '-50px';
        p.style.fontSize = (Math.random() * 24 + 16) + 'px';
        p.style.animationDuration = (Math.random() * 3 + 3) + 's';
        p.style.opacity = Math.random() * 0.5 + 0.3;
        container.appendChild(p);
        setTimeout(() => p.remove(), 6000);
    }
    
    setInterval(create, 600);
}

// ========== 节日列表 ==========
function renderHolidayList() {
    const now = new Date();
    const container = document.getElementById('holidayList');
    
    // 按时间排序
    const sorted = [...HOLIDAYS].sort((a, b) => {
        const da = new Date(now.getFullYear(), a.month - 1, a.day);
        const db = new Date(now.getFullYear(), b.month - 1, b.day);
        return da - db;
    });
    
    container.innerHTML = sorted.map(h => {
        const date = new Date(now.getFullYear(), h.month - 1, h.day);
        const dateStr = `${h.month}月${h.day}日`;
        const isPast = date < now && date.getDate() !== now.getDate();
        const isToday = h.month === now.getMonth() + 1 && h.day === now.getDate();
        
        return `
            <div class="holiday-card p-3 rounded-lg border border-white/10 bg-black/20 ${isToday ? 'border-yellow-500/50 bg-yellow-900/20' : ''} ${isPast ? 'opacity-40' : ''}">
                <div class="flex items-center gap-2">
                    <span class="text-lg">${h.icon}</span>
                    <div>
                        <div class="text-sm font-medium ${isToday ? 'text-yellow-400' : 'text-white'}">${h.name}</div>
                        <div class="text-xs text-white/50">${dateStr}</div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

init();
</script>

</body>
</html>
